name: 发布与更新大乐透选号台

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # UTC 01:37 / 14:37 = 北京时间09:37 / 22:37。GitHub调度可能延迟。
    - cron: '37 1,14 * * *'

permissions:
  contents: read

concurrency:
  group: dlt-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: 安装锁定版本依赖
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: 核对官方开奖
        id: refresh
        continue-on-error: true
        run: pnpm update-data
      - name: 官方接口不可达时保留已验证数据
        if: steps.refresh.outcome == 'failure'
        run: echo '官方接口本次不可达，使用仓库内已有开奖数据，未伪造新号码；稍后调度会重试。' >> "$GITHUB_STEP_SUMMARY"
      - name: 保存新增开奖数据
        if: steps.refresh.outcome == 'success'
        run: |
          if ! git diff --quiet -- data/draws.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/draws.json public/data/draws.json public/data/status.json
            git commit -m 'data: update official lottery draws'
            git push
          fi
      - name: 规则测试及类型检查
        run: |
          pnpm test
          pnpm typecheck
      - name: 构建静态网页
        run: |
          pnpm build
          pnpm verify-build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
          retention-days: 1
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 发布到GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
